server:
  port: 9100
  servlet:
    context-path: /api
#文件存储地址
BASE_LOCATION: E:\java_code\werner\java_pet\pet\src\main\resources\file
DB_NAME: java_pet_2

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/java_pet_2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Aa123456
  # 统一日期序列化格式，避免 Map 返回 ISO 带时区的字符串
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 允许 Map 结果保留 null 列（如未填充的审计字段）
    call-setters-on-nulls: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 允许 Map 结果保留 null 列，保证审计字段在接口中始终存在
    call-setters-on-nulls: true

logging:
  level:
    com:
      example:
        mapper: debug
